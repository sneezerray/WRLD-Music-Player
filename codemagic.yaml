workflows:
  android-debug-apk:
    name: Build Debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      groups: []
    scripts:
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug || gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
