- pipeline: buildapk
  name: Buildapk
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  actions:
  - action: $GRADLE_BIN assembleDebug
    type: BUILD
    commands: |-
      if command -v gradle >/dev/null 2>&1; then
        GRADLE_BIN=gradle
      elif [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        GRADLE_BIN=./gradlew
      else
        echo "No gradle/gradlew found, fetching Gradle 8.7..."
        if command -v curl >/dev/null 2>&1; then
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
        elif command -v wget >/dev/null 2>&1; then
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
        else
          apt-get update && apt-get install -y curl unzip
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
        fi
        unzip -q /tmp/gradle.zip -d /tmp
        GRADLE_BIN=/tmp/gradle-8.7/bin/gradle
      fi

      $GRADLE_BIN assembleDebug
    setup_commands: apt-get update && apt-get install -y unzip curl
    cached_dirs:
    - /root/.gradle
    - /opt/android/sdk
    shell: BASH
    docker_image_name: library/eclipse-temurin
    docker_image_tag: 25
